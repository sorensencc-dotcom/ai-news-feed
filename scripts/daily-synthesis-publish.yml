name: Daily AI Synthesis & Publish

on:
  schedule:
    - cron: '0 11 * * *' # 06:00 AM ET (11:00 UTC) daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synthesize-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run daily synthesis and export
        env:
          GMAIL_CREDENTIALS: ${{ secrets.GMAIL_CREDENTIALS }}
        run: |
          node scripts/export-briefing.mjs

      - name: Build static site
        run: npm run build

      - name: Commit and push new briefing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/briefings/
          if git diff --staged --quiet; then
            echo "No new briefing changes today."
            exit 0
          fi
          git commit -m "chore(briefing): publish synthesis for $(date +'%Y-%m-%d')"
          git push origin main
